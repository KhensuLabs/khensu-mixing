# Builds the macOS installer (khensu-setup-<v>-macos.pkg, plus the .dmg and the
# plug-in .zip) with packaging/macos/build_and_package.sh and attaches it to the
# matching release of this repository, where the app's update check finds it.
#
# Runs on a version tag (v1.2.3) or by hand, with the workflow's own token.
# Signing and notarization are optional, from these secrets:
# MACOS_CODESIGN_IDENTITY, MACOS_INSTALLER_IDENTITY, MACOS_CERTS_P12 (base64),
# MACOS_CERTS_PASSWORD, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD.
#
# Status (2026-11-18): hosted Actions on this account are blocked by a billing
# issue (CFG-01), so this has not run yet; the script it calls is unverified on
# a Mac.
name: release-macos

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write   # attach the installer to this repository's release

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      HAS_CERTS: ${{ secrets.MACOS_CERTS_P12 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Import signing certificates
        if: env.HAS_CERTS == 'true'
        env:
          CERTS: ${{ secrets.MACOS_CERTS_P12 }}
          CERTS_PASSWORD: ${{ secrets.MACOS_CERTS_PASSWORD }}
        run: |
          echo "$CERTS" | base64 --decode > certs.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import certs.p12 -k build.keychain -P "$CERTS_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm certs.p12

      - name: Build and package
        env:
          KHENSU_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          KHENSU_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          KHENSU_APPLE_ID: ${{ secrets.APPLE_ID }}
          KHENSU_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KHENSU_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          KHENSU_PYTHON: python
        run: bash packaging/macos/build_and_package.sh

      - name: Attach to the public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          [[ "$TAG" == v* ]] || TAG="v$(sed -n 's/^#define KHENSU_VERSION_STRING "\(.*\)"/\1/p' shared-core/include/khensu/common/Version.h)"
          gh release upload "$TAG" dist/macos/*.pkg dist/macos/*.dmg dist/macos/*.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
