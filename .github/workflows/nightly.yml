name: Nightly

# BLD-4: Python 3.13 compatibility runs once a night instead of on every push -
# it is not the shipped runtime (3.11) or the dev one (3.12), and the full
# suite on it doubled the per-push Python minutes.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-313:
    name: Python 3.13 compatibility
    runs-on: ${{ fromJSON(vars.KHENSU_LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: local-services
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libsndfile1 libasound2-dev

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q -n auto --durations=25 --ignore=tests/test_golden_regression.py
